<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f3"><title>Losování osobností</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f6f3;color:#171717;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{text-align:center;padding:24px;max-width:560px}.spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid #d9d9d3;border-top-color:#171717;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{font:inherit;padding:12px 18px;border:0;border-radius:12px;cursor:pointer}@media(prefers-color-scheme:dark){body{background:#111210;color:#f5f5f1}.spinner{border-color:#30312c;border-top-color:#f5f5f1}}</style></head><body><div class="box"><div class="spinner"></div><div>Načítám aplikaci…</div></div><script>(async()=>{const urls=['https://raw.githubusercontent.com/Berniocal/osobnosti/main/app.html.gz.b64','https://cdn.jsdelivr.net/gh/Berniocal/osobnosti@main/app.html.gz.b64'];try{let b64='';let lastError=null;for(const url of urls){try{const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);b64=(await r.text()).trim();if(b64)break}catch(e){lastError=e}}if(!b64)throw lastError||new Error('Soubor aplikace nebyl nalezen.');const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Tento prohlížeč nepodporuje rozbalení aplikace.');const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h1>Aplikaci se nepodařilo načíst</h1><p>'+String(e.message||e)+'</p><button onclick="location.reload()">Zkusit znovu</button></div>'}})();</script></body></html>
