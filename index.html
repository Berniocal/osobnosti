const $=id=>document.getElementById(id),els={home:$('home'),game:$('game'),homeBtn:$('homeBtn'),catTitle:$('catTitle'),catDesc:$('catDesc'),newBtn:$('newBtn'),randomBtn:$('randomBtn'),status:$('status'),card:$('card'),photo:$('photo'),placeholder:$('placeholder'),name:$('name'),counter:$('counter'),birth:$('birth'),death:$('death'),occupation:$('occupation'),place:$('place'),known:$('known'),family:$('family'),wikiPanel:$('wikiPanel'),wikiToggle:$('wikiToggle'),wikiExtract:$('wikiExtract'),wikiOpen:$('wikiOpen'),wikiOpenEn:$('wikiOpenEn'),resetBtn:$('resetBtn'),wikiModal:$('wikiModal'),wikiClose:$('wikiClose'),wikiFrame:$('wikiFrame'),wikiModalTitle:$('wikiModalTitle'),wikiExternal:$('wikiExternal')};
let category=null,people=[],drawn=new Set(),current=null,token=0,wikiUrl='',wikiUrlCs='',wikiUrlEn='',activeWikiLang='cs';
function key(){return 'osobnosti-drawn-'+category+'-v1'}function loadDrawn(){try{return new Set(JSON.parse(localStorage.getItem(key())||'[]'))}catch{return new Set()}}function save(){localStorage.setItem(key(),JSON.stringify([...drawn]))}function initials(n){return n.replace(/\b(svatý|svatá|z|ze)\b/gi,'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function showScreen(which){els.home.classList.toggle('active',which==='home');els.game.classList.toggle('active',which==='game')}function enterCategory(cat,push=true){category=cat;people=DATA[cat];drawn=loadDrawn();els.catTitle.textContent=META[cat].title;els.catDesc.textContent=META[cat].desc;els.card.classList.remove('visible');showScreen('game');update();if(push)history.pushState({screen:'game',cat},'','#'+cat)}function goHome(push=false){category=null;current=null;els.card.classList.remove('visible');showScreen('home');if(push)history.pushState({screen:'home'},'','#home')}function update(){const r=people.length-drawn.size;els.newBtn.disabled=!r;els.newBtn.textContent=r?`Vylosovat novou osobnost (${r})`:'Všechny už byly vylosovány';els.status.textContent=drawn.size?`Dosud vylosováno ${drawn.size} z ${people.length}.`:''}
async function wikiData(p,t){
els.photo.hidden=true;els.photo.removeAttribute('src');els.placeholder.hidden=false;els.placeholder.textContent=initials(p.name);els.wikiExtract.textContent='Načítám…';
const sources=category==='cz'?[{lang:'cs',title:p.wiki},{lang:'en',title:p.wikiEn||p.name}]:[{lang:'en',title:p.wikiEn||p.name},{lang:'cs',title:p.wiki}];
let chosen=null;
for(const s of sources){if(!s.title)continue;try{const r=await fetch(`https://${s.lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(s.title.replace(/ /g,'_'))}`);if(!r.ok)continue;const d=await r.json();if(d.type==='disambiguation'||!d.title)continue;chosen={d,lang:s.lang};break}catch{}}
if(t!==token)return;if(!chosen){els.wikiExtract.textContent='Náhled se nepodařilo načíst.';return}
const d=chosen.d,src=d.originalimage?.source||d.thumbnail?.source;
if(src){els.photo.onload=()=>{if(t===token){els.placeholder.hidden=true;els.photo.hidden=false}};els.photo.onerror=()=>{els.photo.hidden=true;els.placeholder.hidden=false};els.photo.src=src}
els.wikiExtract.textContent=d.extract||'Stručný text není dostupný.';if(chosen.lang==='en'&&category!=='cz')els.wikiExtract.textContent+=' (Zdroj: anglická Wikipedie)';}
function timeVal(v){if(!v?.time)return null;const y=parseInt(v.time.slice(1,5));return (y<0?`${Math.abs(y)} př. n. l.`:String(y))}async function wdData(p,t){els.birth.textContent=p.birth||'Načítám…';els.death.textContent=p.death?(p.death==='—'?'žije':p.death):'Načítám…';els.occupation.textContent=p.occupation||'Načítám…';els.place.textContent=p.place||'Načítám…';els.family.textContent='Načítám…';try{const site=category==='cz'?'cswiki':'enwiki';const title=category==='cz'?p.wiki:(p.wikiEn||p.name);let a=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&sites=${site}&titles=${encodeURIComponent(title)}&props=claims&format=json&origin=*`).then(r=>r.json());let first=Object.values(a.entities||{})[0];if(!first||first.missing!==undefined){a=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&sites=cswiki&titles=${encodeURIComponent(p.wiki)}&props=claims&format=json&origin=*`).then(r=>r.json());}if(t!==token)return;const e=Object.values(a.entities||{})[0];if(!e||e.missing!==undefined)throw Error();const claims=e.claims||{},ids=[];const getIds=pid=>(claims[pid]||[]).map(c=>c.mainsnak?.datavalue?.value?.id).filter(Boolean);const occ=getIds('P106'),birth=(claims.P569||[])[0]?.mainsnak?.datavalue?.value,death=(claims.P570||[])[0]?.mainsnak?.datavalue?.value,place=getIds('P19');const fam=[['manžel/ka',getIds('P26')],['děti',getIds('P40')],['otec',getIds('P22')],['matka',getIds('P25')]].filter(x=>x[1].length);ids.push(...occ,...place,...fam.flatMap(x=>x[1]));let labels={};if(ids.length){const b=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${[...new Set(ids)].join('|')}&props=labels&languages=cs|en&format=json&origin=*`).then(r=>r.json());for(const [id,x] of Object.entries(b.entities||{}))labels[id]=x.labels?.cs?.value||x.labels?.en?.value||id}if(!p.birth)els.birth.textContent=timeVal(birth)||'neuvedeno';if(!p.death)els.death.textContent=timeVal(death)||'žije / neuvedeno';if(!p.occupation)els.occupation.textContent=occ.slice(0,4).map(i=>labels[i]).join(', ')||'neuvedeno';if(!p.place)els.place.textContent=place.slice(0,2).map(i=>labels[i]).join(', ')||'neuvedeno';els.family.textContent=fam.length?fam.map(([l,v])=>`${l}: ${v.slice(0,5).map(i=>labels[i]).join(', ')}`).join('; '):'rodinné údaje nejsou uvedeny'}catch{for(const el of [els.birth,els.death,els.occupation,els.place,els.family])if(el.textContent==='Načítám…')el.textContent='údaj se nepodařilo načíst'}}
function renderPerson(i,markDrawn=true,updateHistory=true){current=people[i];if(markDrawn){drawn.add(i);save();update()}els.card.classList.remove('visible');void els.card.offsetWidth;els.card.classList.add('visible');els.name.textContent=current.name;els.known.textContent=current.known||'viz článek na Wikipedii';els.counter.textContent=`${drawn.size} / ${people.length}`;els.wikiPanel.classList.remove('open');wikiUrlCs=`https://cs.m.wikipedia.org/wiki/${encodeURIComponent(current.wiki.replace(/ /g,'_'))}`;wikiUrlEn=`https://en.m.wikipedia.org/wiki/${encodeURIComponent((current.wikiEn||current.name).replace(/ /g,'_'))}`;activeWikiLang=category==='cz'?'cs':'en';wikiUrl=activeWikiLang==='cs'?wikiUrlCs:wikiUrlEn;token++;wikiData(current,token);wdData(current,token);if(updateHistory)history.replaceState({screen:'person',cat:category,index:i},'','#'+category+'-osobnost');els.card.scrollIntoView({behavior:'smooth',block:'start'})}function showPerson(i){renderPerson(i,true,true)}function openWiki(lang=activeWikiLang){if(!current)return;activeWikiLang=lang;wikiUrl=lang==='en'?wikiUrlEn:wikiUrlCs;els.wikiModalTitle.textContent=current.name;els.wikiExternal.href=wikiUrl;els.wikiModal.classList.add('open');document.body.classList.add('modal-open');try{els.wikiFrame.contentWindow.location.replace(wikiUrl)}catch{els.wikiFrame.src=wikiUrl}const i=people.indexOf(current);history.pushState({screen:'wiki',cat:category,index:i,lang},'','#wikipedia')}function hideWiki(){els.wikiModal.classList.remove('open');document.body.classList.remove('modal-open')}function closeWiki(){if(els.wikiModal.classList.contains('open'))history.back()}
document.querySelectorAll('.category').forEach(b=>b.onclick=()=>enterCategory(b.dataset.cat));els.homeBtn.onclick=()=>history.back();els.newBtn.onclick=()=>{const r=people.map((_,i)=>i).filter(i=>!drawn.has(i));if(r.length)showPerson(r[Math.floor(Math.random()*r.length)])};els.randomBtn.onclick=()=>showPerson(Math.floor(Math.random()*people.length));els.resetBtn.onclick=()=>{drawn.clear();save();update();els.status.textContent='Historie byla vynulována.'};els.wikiToggle.onclick=()=>els.wikiPanel.classList.toggle('open');els.wikiOpen.onclick=()=>openWiki('cs');els.wikiOpenEn.onclick=()=>openWiki('en');els.wikiClose.onclick=closeWiki;window.addEventListener('popstate',e=>{hideWiki();const s=e.state;if(s?.screen==='person'&&s.cat&&Number.isInteger(s.index)){enterCategory(s.cat,false);renderPerson(s.index,false,false)}else if(s?.screen==='game'&&s.cat)enterCategory(s.cat,false);else goHome(false)});history.replaceState({screen:'home'},'','#home');
