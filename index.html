<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f3"><title>Losování osobností</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f6f3;color:#171717;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{text-align:center;padding:24px}.spinner{width:38px;height:38px;margin:0 auto 16px;border:4px solid #d9d9d3;border-top-color:#171717;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){body{background:#111210;color:#f5f5f1}.spinner{border-color:#30312c;border-top-color:#f5f5f1}}</style></head><body><div class="box"><div class="spinner"></div><div>Načítám aplikaci…</div></div><script>(async()=>{try{const b64=(await fetch('app.html.gz.b64?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Soubor aplikace nebyl nalezen.');return r.text()})).trim();const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Tento prohlížeč nepodporuje rozbalení aplikace.');const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h1>Aplikaci se nepodařilo načíst</h1><p>'+String(e.message||e)+'</p><button onclick="location.reload()" style="font:inherit;padding:12px 18px;border:0;border-radius:12px">Zkusit znovu</button></div>'}})();</script></body></html>
